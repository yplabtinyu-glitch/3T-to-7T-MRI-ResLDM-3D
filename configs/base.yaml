# 3T -> 7T latent diffusion, 3D. Every script takes --config this file; out_dir holds all checkpoints / logs / caches.
out_dir: runs/base
seed: 0
bf16: true            # bf16 autocast on CUDA (H200 / A100); ignored on CPU
num_workers: 8

data:
  pairs_csv: data/pairs.csv     # columns: subject, split (train/val/test), t3, t7   (3T already registered to the 7T grid)
  data_dir: data                # prepare_data.py writes data/prepped/*.npy and data/hist_ref.npz here
  patch: 64                     # every stage works on 64^3 image patches (8^3 x 4 latents)
  pad_stride: 32                # zero padding (symmetric) so (size - patch) % pad_stride == 0; must be a multiple of every stride below
  norm_pct: 99.5                # intensity: clip at this foreground percentile, scale to [0, 1]
  brain_thr: 0.02               # foreground / brain mask threshold on [0, 1] images

ae:
  channels: [32, 64, 128, 128]  # 3 downsamplings -> 8x per axis (same factor as the 2D AE: 128^2 -> 16^2)
  latent_channels: 4
  num_res_blocks: 2
  attention_levels: [false, false, false, false]
  norm_num_groups: 32
  use_checkpoint: true          # gradient checkpointing: needed when decoding with grad for image losses
  train:
    patch: 64                   # = data.patch
    stride: 16                  # AE patches are drawn from a stride-16 grid (75 % overlap between neighbours)
    batch_size: 8               # 3T and 7T patches are stacked, so the real batch is 2x this
    samples_per_epoch: 2000
    val_samples: 200
    epochs: 100
    lr: 1.0e-4
    kl_weight: 1.0e-6
    mask_ratio: 0.25            # masked AE: fraction of 8^3 blocks per input patch set to background (training only; 0 = off)
    mask_block: 8               # block size in voxels = one latent voxel (64 / 8)
    adv_weight: 0.0             # optional 3D PatchGAN (LSGAN); off -- AE loss is L1 + KL
    adv_start_epoch: 10
    adv_layers: 3               # PatchGAN depth; needs patch >= ~2^(layers+2)
    patience: 15

latent:
  stride: 32                    # latent cache: every 64^3 patch on a stride-32 grid is encoded on its own (same as inference)
  batch: 64                     # patches per encoder / SPADE forward pass when building the cache

spade:
  num_classes: 2                # class 1 = 7T (same convention as the 2D SPADE)
  nf: 64
  train:
    batch_size: 16              # one item = the 8^3 latent of one cached patch
    samples_per_epoch: 2000
    val_samples: 200
    epochs: 60
    lr: 1.0e-4
    lambda_latent: 1.0          # L1 to the 7T latent
    patience: 10
  losses:                       # image-space losses (see mri3d/imageloss.py)
    lambda_mind: 1.0            # MIND structure loss vs the same-subject 3T (the MIND-SPADE of the 2D pipeline)
    brain_thr: 0.02
    margin: 8                   # image voxels ignored at the patch border
    sub_crop: null              # null = whole 8^3 latent patch (64^3 decoded)

diffusion:
  T: 4
  p: 0.3
  kappa: auto                   # auto = per-channel std(scaled zspade - scaled z7t) on the training cache, or a list
  kappa_mult: 1.0
  condition: 3t                 # none | 3t | spade | all
  unet:
    channels: [64, 128, 256]
    attention_levels: [false, false, true]
    num_res_blocks: 2
    num_head_channels: 32
  train:
    batch_size: 16
    samples_per_epoch: 4000
    val_samples: 400
    epochs: 60
    lr: 1.0e-4
    patience: 10
    ckpt_every: 10
    lambda_simple: 1.0          # weight of the latent MSE
    compile: false              # torch.compile(mode="reduce-overhead"): CUDA graphs against CPU launch overhead
  losses:
    lambda_mind: 1.0            # structure vs the same-subject 3T
    lambda_lf: 3.0              # low-frequency intensity vs SPADE
    lf_factor: 8
    lambda_corr: 0.0            # RegGAN-style registration-corrected L1 vs 7T (p5 of the 2D pipeline); 0 = off
    corr_smooth: 1.0
    corr_max_disp: 4.0
    brain_thr: 0.02
    margin: 8
    sub_crop: null

infer:
  split: test
  hist_match: both              # none | 3t | both
  stride: 32                    # 64^3 patches on a stride-32 grid; each goes encoder -> SPADE -> ResShift -> decoder
  batch: 64                     # patches per forward pass
  merge: mean                   # overlapping outputs are averaged voxel-wise
  seed: 0
  save_nifti: true
